name: WDL validation

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/wdl-validation.yml"
      - ".dockstore.yml"
      - "workflows/**/*.wdl"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/wdl-validation.yml"
      - ".dockstore.yml"
      - "workflows/**/*.wdl"

jobs:
  miniwdl-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install miniwdl
        run: pipx install miniwdl

      - name: Check Dockstore workflow names
        run: |
          "$(pipx environment --value PIPX_LOCAL_VENVS)/miniwdl/bin/python" - <<'PYTHON'
          from pathlib import Path
          from ruamel.yaml import YAML

          config = YAML(typ="safe").load(Path(".dockstore.yml").read_text())
          entries = config.get("workflows", []) + config.get("tools", [])
          names = [entry.get("name") for entry in entries]
          if not all(isinstance(name, str) and name.strip() for name in names):
              raise SystemExit("Every Dockstore workflow/tool must have a non-empty name")
          if len(names) != len(set(names)):
              raise SystemExit("Dockstore workflow/tool names must be unique")
          print(f"Validated {len(names)} unique Dockstore names: {', '.join(names)}")
          PYTHON

      - name: Check WDLs
        run: |
          shopt -s globstar nullglob
          wdls=(workflows/**/*.wdl)

          if [ ${#wdls[@]} -eq 0 ]; then
            echo "No WDL files found under workflows/."
            exit 0
          fi

          for wdl in "${wdls[@]}"; do
            echo "Checking ${wdl}"
            miniwdl check "${wdl}"
          done

  womtool-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download WOMtool
        run: |
          curl --fail --location --retry 3 \
            --output "${RUNNER_TEMP}/womtool.jar" \
            https://github.com/broadinstitute/cromwell/releases/download/91/womtool-91.jar

      - name: Validate WDLs with Cromwell parser
        run: |
          shopt -s globstar nullglob
          for wdl in workflows/**/*.wdl; do
            echo "Validating ${wdl} with WOMtool 91"
            java -jar "${RUNNER_TEMP}/womtool.jar" validate "${wdl}"
          done
