name: Olink Docker Hub Publish

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Commit SHA of a tested Olink image published to GHCR
        required: true
        type: string

permissions:
  contents: read

env:
  SOURCE_IMAGE: ghcr.io/aou-multiomics-analysis/rarevariantenrichment-olink
  DOCKERHUB_IMAGE: docker.io/epadhi/rarevariantenrichment-olink

jobs:
  copy_tested_image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Check source tag and Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_sha must be a full, lowercase, 40-character commit SHA."
            exit 1
          fi
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Add the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."
            exit 1
          fi

      - name: Pull the tested image without rebuilding it
        run: |
          set -euo pipefail
          echo "[olink-publish] Pull the tested Linux AMD64 image from GHCR"
          docker pull --platform linux/amd64 "${SOURCE_IMAGE}:sha-${SOURCE_SHA}"
          docker image inspect "${SOURCE_IMAGE}:sha-${SOURCE_SHA}" \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Copy the tested image to Docker Hub
        run: |
          set -euo pipefail
          echo "[olink-publish] Copy the tested image to Docker Hub"
          for tag in "sha-${SOURCE_SHA}" main; do
            docker tag "${SOURCE_IMAGE}:sha-${SOURCE_SHA}" "${DOCKERHUB_IMAGE}:${tag}"
            docker push "${DOCKERHUB_IMAGE}:${tag}"
          done
          echo "[olink-publish] Verify the published image"
          docker pull --platform linux/amd64 "${DOCKERHUB_IMAGE}:sha-${SOURCE_SHA}"
          source_id=$(docker image inspect "${SOURCE_IMAGE}:sha-${SOURCE_SHA}" --format '{{.Id}}')
          target_id=$(docker image inspect "${DOCKERHUB_IMAGE}:sha-${SOURCE_SHA}" --format '{{.Id}}')
          test "$source_id" = "$target_id"
          docker image inspect "${DOCKERHUB_IMAGE}:sha-${SOURCE_SHA}" \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' >> "$GITHUB_STEP_SUMMARY"
