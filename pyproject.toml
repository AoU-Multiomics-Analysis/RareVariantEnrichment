[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rare-variant-enrichment"
version = "0.2.0"
requires-python = ">=3.12"

[project.scripts]
rare-variant-enrichment = "rare_variant_enrichment.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
